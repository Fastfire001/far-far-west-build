services:
  app:
    build: .
    # Run as the host user so the generated files are not owned by root.
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./data:/app/data
      - ./assets:/app/assets
      - ./.cache/game:/extract:ro

  # Reads assets from the local game install (see bin/extract-game).
  extract:
    build: tools/game-extract
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - "${FFW_GAME_DIR:-./.missing-game-dir}:/game:ro"
      - ./.cache/game:/out
      - ./.cache/oodle:/cache

  # Vue app (web/). The whole repo is mounted: the app reads data/ and assets/icons/ directly.
  web:
    build: web
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      # The host user may not exist in the image: keep npm's cache and config inside the repo.
      HOME: /repo/.cache/home
      npm_config_cache: /repo/.cache/npm
    volumes:
      - .:/repo
    ports:
      - "5173:5173"
