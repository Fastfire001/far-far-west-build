services:
  app:
    build: .
    # Run as the host user so the generated files are not owned by root.
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./data:/app/data
      - ./assets:/app/assets
      - ./.cache/game:/extract:ro

  # Reads assets from the local game install (see bin/extract-game).
  extract:
    build: tools/game-extract
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - "${FFW_GAME_DIR:-./.missing-game-dir}/FarFarWest/Content/Paks:/paks:ro"
      - ./.cache/game:/out
      - ./.cache/oodle:/cache
